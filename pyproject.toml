[project]
name = "message-queue-simulator"
version = "0.1.0"
description = "A message queue simulator implementing the producer-consumer pattern."
authors = [
    {name = "Matias Torres",email = "matiast999@hotmail.com"}
]
license = "MIT"
requires-python = ">=3.14,<4.0"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.14,<0.16.0)"
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]
